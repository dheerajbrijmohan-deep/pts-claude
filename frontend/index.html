<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --cream:#F3E8D6; --card:#EADFC8; --card-2:#E2D5BA; --ink:#2A2118; --ink-soft:#71624E;
  --line:#DBCBA9; --accent:#C1602A; --accent-ink:#FBF3E9; --accent-soft:#EAC9A9;
  --rail:#2A2019; --rail-ink:#EFE3D0; --rail-ink-soft:#B7A488; --rail-line:#453629;
  --good:#4F6E3C; --good-soft:#DCE5C8; --warn:#9C7014; --warn-soft:#EFDDAC;
  --bad:#93362F; --bad-soft:#EDD0C8; --mono:#5A4C38; --shadow:0 12px 30px -18px rgba(42,33,24,0.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#1D1712; --card:#271F17; --card-2:#2E251B; --ink:#EFE4D0; --ink-soft:#B3A387;
    --line:#453729; --accent:#E27C42; --accent-ink:#241207; --accent-soft:#4A3320;
    --rail:#141009; --rail-ink:#F0E5D2; --rail-ink-soft:#9C8B70; --rail-line:#332920;
    --good:#8CAE6C; --good-soft:#2E3A22; --warn:#D6AA4E; --warn-soft:#3D3115;
    --bad:#E08579; --bad-soft:#3F2420; --mono:#C2B393; --shadow:0 12px 30px -18px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --cream:#1D1712; --card:#271F17; --card-2:#2E251B; --ink:#EFE4D0; --ink-soft:#B3A387;
  --line:#453729; --accent:#E27C42; --accent-ink:#241207; --accent-soft:#4A3320;
  --rail:#141009; --rail-ink:#F0E5D2; --rail-ink-soft:#9C8B70; --rail-line:#332920;
  --good:#8CAE6C; --good-soft:#2E3A22; --warn:#D6AA4E; --warn-soft:#3D3115;
  --bad:#E08579; --bad-soft:#3F2420; --mono:#C2B393; --shadow:0 12px 30px -18px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; background:var(--cream); color:var(--ink); font-family:"Plus Jakarta Sans",system-ui,sans-serif; line-height:1.5;}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif; margin:0;}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
button{font-family:inherit;}
a{color:inherit;}
input,select,textarea{font-family:inherit; font-size:14px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- login ---------- */
.login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:36px 32px; box-shadow:var(--shadow);}
.login-card .mark{display:inline-flex; align-items:center; justify-content:center; padding:9px 12px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-family:"Playfair Display",serif; font-weight:700; font-size:16px; letter-spacing:.03em; margin-bottom:16px;}
.login-card h1{font-size:19px; font-style:italic; margin-bottom:4px; text-wrap:balance;}
.login-card .sub{font-size:13px; color:var(--ink-soft); margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field input,.field select,.field textarea{
  width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--cream); color:var(--ink);
}
.field textarea{resize:vertical; min-height:60px;}
.view-value{font-size:14px; color:var(--ink); padding:8px 0 2px; min-height:20px; line-height:1.4; word-break:break-word;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:9px;
  padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer; background:var(--card-2); color:var(--ink);
}
.btn.primary{background:var(--accent); color:var(--accent-ink);}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
.btn.danger{background:var(--bad); color:#fff;}
.btn.warn{background:var(--warn); color:#241a00;}
.btn.good{background:var(--good); color:#fff;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn.block{width:100%;}
.error-text{color:var(--bad); font-size:12.5px; margin-top:10px; min-height:1em;}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh;}
.rail{width:230px; flex:0 0 230px; background:var(--rail); color:var(--rail-ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
.rail-brand{padding:22px 20px 16px; border-bottom:1px solid var(--rail-line); display:flex; gap:10px; align-items:center;}
.rail-brand .mark{padding:6px 8px; border-radius:7px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:"Playfair Display",serif; font-weight:700; font-size:11.5px; letter-spacing:.02em; flex:0 0 auto;}
.rail-brand h1{font-size:17px; line-height:1.2;}
.rail-brand span{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--rail-ink-soft);}
.rail nav{padding:12px; overflow-y:auto; flex:1;}
.rail .group-label{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--rail-ink-soft); padding:14px 10px 6px;}
.rail-link{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 11px; border-radius:7px; font-size:13.5px; color:var(--rail-ink-soft); margin:1px 0; cursor:pointer; border:none; background:none; width:100%; text-align:left;}
.rail-link:hover{background:rgba(255,255,255,.06); color:var(--rail-ink);}
.rail-link.active{background:var(--accent); color:var(--accent-ink); font-weight:700;}
.rail-link.disabled{cursor:default; opacity:.55;}
.rail-link.disabled:hover{background:none; color:var(--rail-ink-soft);}
.rail-link .soon{font-family:"IBM Plex Mono",monospace; font-size:9px; background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px;}
.rail-foot{padding:14px 20px 18px; border-top:1px solid var(--rail-line);}
.rail-foot button{width:100%;}

main{flex:1; min-width:0; padding:32px 40px 60px; max-width:1180px;}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h2{font-size:26px;}
.page-head .sub{font-size:13px; color:var(--ink-soft); margin-top:4px;}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.toolbar input[type=search]{padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); min-width:200px;}

.kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:26px;}
.kpi.attn{border-color:var(--warn); background:var(--warn-soft);}
.kpi.attn .v, .kpi.attn .l{color:var(--warn);}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
.kpi .v{font-family:"IBM Plex Mono",monospace; font-size:24px; font-weight:500;}
.kpi .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
.kpi.clickable{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.kpi.clickable:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.08);}
.kpi.clickable:active{transform:translateY(0);}

.filter-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:20px; background:var(--warn-soft); color:var(--warn); font-size:12.5px; font-weight:600;}
.filter-chip button{border:none; background:none; color:inherit; cursor:pointer; font-size:14px; line-height:1; padding:0;}

.card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card-2);}
td{padding:11px 16px; border-bottom:1px solid var(--line); vertical-align:middle;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--card-2);}
tbody tr:last-child td{border-bottom:none;}
.empty-row td{cursor:default; text-align:center; color:var(--ink-soft); padding:34px;}
.empty-row:hover{background:none;}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; text-transform:capitalize;}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

.name-cell b{display:block;}
.name-cell span{font-size:11.5px; color:var(--ink-soft);}

/* ---------- modal / drawer ---------- */
.overlay{position:fixed; inset:0; background:rgba(20,15,10,.45); display:flex; justify-content:flex-end; z-index:50;}
.drawer{width:min(560px, 100%); background:var(--cream); height:100vh; overflow-y:auto; box-shadow:-16px 0 40px -20px rgba(0,0,0,.4); animation:slidein .18s ease-out;}
@keyframes slidein{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
@media (prefers-reduced-motion: reduce){ .drawer{animation:none;} }
.drawer-head{display:flex; justify-content:space-between; align-items:flex-start; padding:24px 26px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--cream); z-index:2;}
.drawer-head h3{font-size:21px;}
.drawer-body{padding:22px 26px 40px;}
.close-x{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}

.overlay.center{align-items:center; justify-content:center;}
.modal{width:min(460px, 92vw); background:var(--cream); border-radius:16px; box-shadow:var(--shadow); padding:24px 26px;}
.modal h3{font-size:19px; margin-bottom:6px;}
.modal .desc{font-size:13px; color:var(--ink-soft); margin-bottom:16px;}
.modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px;}
.tab-btn{background:none; border:none; padding:9px 4px; margin-right:18px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}

.doc-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
.doc-row:last-child{border-bottom:none;}
.doc-row .icon{width:34px; height:34px; border-radius:8px; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:15px; flex:0 0 auto;}
.doc-row .meta{flex:1; min-width:0;}
.doc-row .meta b{font-size:13.5px; display:block;}
.doc-row .meta span{font-size:11.5px; color:var(--ink-soft);}
.doc-row .row-actions{display:flex; gap:6px; flex:0 0 auto;}
.icon-btn{background:var(--card-2); border:1px solid var(--line); border-radius:7px; padding:5px 9px; font-size:13px; cursor:pointer; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; line-height:1;}
.icon-btn.danger{color:var(--bad);}

.upload-box{border:1.5px dashed var(--line); border-radius:12px; padding:16px; margin-top:6px; background:var(--card);}
.hist-row{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
.hist-row:last-child{border-bottom:none;}
.hist-row .when{color:var(--ink-soft); flex:0 0 132px; font-family:"IBM Plex Mono",monospace; font-size:11px;}

.toast-wrap{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:100;}
.toast{background:var(--rail); color:var(--rail-ink); padding:11px 16px; border-radius:9px; font-size:13px; box-shadow:var(--shadow); max-width:320px;}
.toast.err{background:var(--bad);}

.coming-soon{padding:60px 20px; text-align:center; color:var(--ink-soft);}
.coming-soon h2{margin-bottom:8px; color:var(--ink);}

.menu-toggle{display:none;}
@media (max-width:900px){
  .rail{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s;}
  .rail.open{transform:translateX(0);}
  .rail-scrim{display:none; position:fixed; inset:0; background:rgba(20,15,10,.4); z-index:39;}
  .rail-scrim.open{display:block;}
  .menu-toggle{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px;
    border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-size:16px; cursor:pointer; margin-bottom:16px;
  }
  main{padding:20px;}
  .kpis{grid-template-columns:repeat(2,1fr);}
}
@media (prefers-reduced-motion: reduce){ .rail{transition:none;} }
@media print{ .rail, .rail-scrim, .menu-toggle, .page-head .toolbar, .form-grid, .btn, .toast-wrap, .topbar-user{display:none !important;} .shell{display:block;} main{padding:0;} }
.topbar-user{position:fixed; top:14px; right:18px; z-index:60; display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 8px 6px 16px; box-shadow:var(--shadow);}
.topbar-user .who{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
.topbar-user button{padding:6px 14px; font-size:12.5px;}
@media (max-width:900px){ .topbar-user{top:auto; bottom:14px; right:14px; left:14px; justify-content:space-between;} }
</style>
</head>
<body>
<div id="app"></div>

<script>
const state = {
  loading:true, loggedIn:false, loginError:'',
  view:'dashboard',
  drivers:[], vehicles:[], expiringDocs:[],
  driverDetail:null, vehicleDetail:null,
  drawer:null, // {type:'driver'|'vehicle', mode:'add'|'edit'|'view', id}
  modal:null,
  driverSearch:'', vehicleSearch:'',
  driverStatusFilter:null, vehicleAssignedFilter:null,
  adminUsername:null, adminRole:null, adminUsersList:null,
  toasts:[],
  earningsDriverId:null, earningsLogs:null,
  adminExpenseClaims:null, adminLeaveRequests:null,
  liveLocations:null, drivingEvents:null, allAnnouncements:null,
  reportEntity:'driver_earnings', reportFrom:null, reportTo:null, reportResult:null,
  finesList:null, advancesList:null, payrollList:null, payrollDriverId:null, payrollPreview:null,
  maintenanceList:null, maintenanceDueSoon:null,
  incidentsList:null,
  notificationsList:null,
  auditLogsList:null,
  analyticsData:null, analyticsFrom:null, analyticsTo:null,
  vehicleProfit:{ expandedVehicleId:null, filterMode:'today', month:new Date().toISOString().slice(0,7), customFrom:'', customTo:'', cards:{}, detail:null, loading:false },
  websiteBookings:null, websiteContacts:null,
};

function goToView(viewId, extraState){
  Object.assign(state, extraState||{});
  state.view = viewId;
  state.railOpen = false;
  render();
  loadViewData(viewId);
}

async function loadViewData(viewId){
  try{
    if(viewId==='earnings'){
      if(!state.earningsDriverId && state.drivers.length) state.earningsDriverId = state.drivers[0].id;
      if(state.earningsDriverId){ state.earningsLogs = await api('/drivers/'+state.earningsDriverId+'/duty-logs'); render(); }
    } else if(viewId==='expenses'){
      state.adminExpenseClaims = await api('/expense-claims'); render();
    } else if(viewId==='leave-requests'){
      state.adminLeaveRequests = await api('/leave-requests'); render();
    } else if(viewId==='live-map'){
      state.liveLocations = await api('/locations/live'); render();
    } else if(viewId==='driving-events'){
      state.drivingEvents = await api('/driving-events'); render();
    } else if(viewId==='warnings'){
      state.allAnnouncements = await api('/announcements'); render();
    } else if(viewId==='settings'){
      if(state.adminRole==='boss'){ state.adminUsersList = await api('/admin-users'); render(); }
    } else if(viewId==='fines'){
      state.finesList = await api('/fines'); render();
    } else if(viewId==='advances'){
      state.advancesList = await api('/advances'); render();
    } else if(viewId==='payroll'){
      if(!state.payrollDriverId && state.drivers.length) state.payrollDriverId = state.drivers[0].id;
      state.payrollList = await api('/payroll'); render();
    } else if(viewId==='maintenance'){
      state.maintenanceList = await api('/maintenance'); render();
      state.maintenanceDueSoon = await api('/maintenance/due-soon'); render();
    } else if(viewId==='incidents'){
      state.incidentsList = await api('/incidents'); render();
    } else if(viewId==='notifications'){
      state.notificationsList = await api('/notifications'); render();
    } else if(viewId==='audit-logs'){
      state.auditLogsList = await api('/audit-logs'); render();
    } else if(viewId==='analytics'){
      const q = (state.analyticsFrom?('?from='+state.analyticsFrom+'&to='+(state.analyticsTo||'2999-12-31')):'');
      state.analyticsData = await api('/analytics'+q); render();
    } else if(viewId==='vehicle-profit'){
      state.vehicleProfit.cards = {}; render();
      await loadVehicleProfitCards();
      if(state.vehicleProfit.expandedVehicleId) await loadVehicleProfitDetail();
    } else if(viewId==='website-leads'){
      state.websiteBookings = await api('/website/bookings');
      state.websiteContacts = await api('/website/contact');
      render();
    }
  }catch(ex){ toast(ex.message, true); }
}

function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    if(k === 'class') node.className = attrs[k];
    else if(k === 'onclick' && typeof attrs[k] === 'function'){
      // Guards every click handler in the app against double-submits: a
      // second click while the first is still in flight (e.g. a slow network
      // request) is ignored instead of firing a duplicate request.
      const handler = attrs[k];
      node.addEventListener('click', async (ev)=>{
        if(node.dataset.busy === '1') return;
        node.dataset.busy = '1';
        const wasDisabled = node.disabled;
        if('disabled' in node) node.disabled = true;
        try{ await handler(ev); }
        finally{ node.dataset.busy = ''; if('disabled' in node) node.disabled = wasDisabled; }
      });
    }
    else if(k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
    else if(k === 'html') node.innerHTML = attrs[k];
    else if(k === 'value') node.value = attrs[k]==null?'':attrs[k]; // textareas ignore the value ATTRIBUTE; the property works for input/select/textarea alike
    else if(attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
  }
  (children||[]).flat().forEach(c=>{
    if(c===null||c===undefined||c===false) return;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  });
  return node;
}

function toast(message, isErr){
  const id = Date.now()+Math.random();
  state.toasts.push({id, message, isErr});
  renderToasts();
  setTimeout(()=>{ state.toasts = state.toasts.filter(t=>t.id!==id); renderToasts(); }, 4200);
}
function renderToasts(){
  let wrap = document.getElementById('toastWrap');
  if(!wrap){ wrap = el('div',{id:'toastWrap', class:'toast-wrap'}); document.body.appendChild(wrap); }
  wrap.innerHTML='';
  state.toasts.forEach(t=> wrap.appendChild(el('div',{class:'toast'+(t.isErr?' err':'')},[t.message])));
}

async function api(path, opts){
  opts = opts || {};
  const headers = opts.body && !(opts.body instanceof FormData) ? {'Content-Type':'application/json'} : {};
  const res = await fetch('/api'+path, {
    method: opts.method || 'GET',
    credentials:'include',
    headers,
    body: opts.body ? (opts.body instanceof FormData ? opts.body : JSON.stringify(opts.body)) : undefined,
  });
  let data = null;
  const text = await res.text();
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
  if(!res.ok){
    const err = new Error((data && data.error) || ('Request failed ('+res.status+')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function fmtTime(iso){ if(!iso) return '—'; const d = new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((target-now)/86400000);
}
function docExpiryPill(expiresOn){
  if(!expiresOn) return el('span',{class:'pill'},['No expiry set']);
  const d = daysUntil(expiresOn);
  if(d<0) return el('span',{class:'pill bad'},['Expired']);
  if(d<=7) return el('span',{class:'pill bad'},['Expires in '+d+'d']);
  if(d<=30) return el('span',{class:'pill warn'},['Expiring soon']);
  return el('span',{class:'pill good'},['Valid']);
}
const STATUS_PILL_CLASS = {
  active:'good', suspended:'warn', maintenance:'warn', terminated:'bad', retired:'bad', pending:'warn', approved:'good', rejected:'bad',
  checked_in:'good', on_lunch:'warn', checked_out:'bad', not_started:'warn',

// Shared lock/commit cell used on Earnings and Expense Claims. Everyone sees
// a "Locked" badge once committed; only the Boss gets a button to toggle it.
function commitCell(entityPath, row, onChanged){
  if(!row.committed_at){
    if(state.adminRole!=='boss') return el('span',{style:'font-size:11.5px;color:var(--ink-soft);'},['—']);
    return el('button',{class:'icon-btn', onclick: async ()=>{
      try{ await api('/'+entityPath+'/'+row.id+'/commit', {method:'POST'}); toast('Committed — locked for the Manager.'); onChanged&&onChanged(); }
      catch(ex){ toast(ex.message, true); }
    }},['Commit']);
  }
  if(state.adminRole!=='boss'){
    return el('span',{class:'pill warn', title:'Committed by the Boss — locked'},['🔒 Locked']);
  }
  return el('div',{style:'display:flex;align-items:center;gap:6px;'},[
    el('span',{class:'pill warn'},['🔒 Locked']),
    el('button',{class:'icon-btn', onclick: async ()=>{
      try{ await api('/'+entityPath+'/'+row.id+'/uncommit', {method:'POST'}); toast('Un-committed.'); onChanged&&onChanged(); }
      catch(ex){ toast(ex.message, true); }
    }},['Uncommit']),
  ]);
}

    el('div',{},[el('h2',{},['Live Map']), el('div',{class:'sub'},[locs.length+' on duty right now'])]),

    const center = locs.length ? [locs[0].lat, locs[0].lng] : [21.1458, 79.0882];

      L.circleMarker([loc.lat, loc.lng], { radius: 9, color, fillColor: color, fillOpacity: 0.85, weight: 2 })

// ---------------- vehicle expenses & profit ----------------
function r2(n){ return Math.round((Number(n)||0)*100)/100; }
function inrp(n){ const v = r2(n); return (v<0?'−':'')+'₹'+Math.abs(v).toLocaleString('en-IN'); }

function vehicleProfitRange(){
  const vp = state.vehicleProfit;
  const today = new Date().toISOString().slice(0,10);
  if(vp.filterMode==='month'){
    const [y,m] = vp.month.split('-').map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    return { from: vp.month+'-01', to: vp.month+'-'+String(lastDay).padStart(2,'0') };
  }
  if(vp.filterMode==='custom'){
    return { from: vp.customFrom||today, to: vp.customTo||today };
  }
  return { from: today, to: today };
}

async function loadVehicleProfitCards(){
  const today = new Date().toISOString().slice(0,10);
  await Promise.all(state.vehicles.map(async (v)=>{
    try{ state.vehicleProfit.cards[v.id] = await api('/vehicles/'+v.id+'/profit?from='+today+'&to='+today); }
    catch(e){ /* leave uncached; card shows a loading dash */ }
  }));
  render();
}

async function loadVehicleProfitDetail(){
  const vp = state.vehicleProfit;
  const {from,to} = vehicleProfitRange();
  vp.loading = true; render();
  try{ vp.detail = await api('/vehicles/'+vp.expandedVehicleId+'/profit?from='+from+'&to='+to); }
  catch(ex){ vp.detail = null; toast(ex.message, true); }
  vp.loading = false; render();
}

    el('div',{},[el('h2',{},['Vehicles']), el('div',{class:'sub'},[state.vehicles.length+' in the fleet'])]),
    el('div',{class:'toolbar'},[
      state.vehicleAssignedFilter ? el('span',{class:'filter-chip'},[
        state.vehicleAssignedFilter==='assigned' ? 'Assigned only' : 'Unassigned only',
        el('button',{onclick:()=>{state.vehicleAssignedFilter=null; render();}, title:'Clear filter'},['×']),
      ]) : null,
      searchInput(state.vehicleSearch, v=>{state.vehicleSearch=v; render();}, 'Search vehicles…'),
      el('button',{class:'btn primary', onclick:()=>openVehicleDrawer('add')},['+ Add vehicle']),
    ]),
  ]));

  const q = state.vehicleSearch.trim().toLowerCase();
  const rows = state.vehicles.filter(v=>
    (!q || v.reg_no.toLowerCase().includes(q) || (v.model||'').toLowerCase().includes(q) || (v.driver_name||'').toLowerCase().includes(q)) &&
    (!state.vehicleAssignedFilter || (state.vehicleAssignedFilter==='assigned' ? !!v.assigned_driver_id : !v.assigned_driver_id))
  );

  const table = el('table',{},[
    el('thead',{},[el('tr',{},[
      el('th',{},['Reg. no.']), el('th',{},['Model']), el('th',{},['Status']), el('th',{},['Driver']), el('th',{},['Documents']),
    ])]),
  ]);
  const tbody = el('tbody',{});
  if(!rows.length){
    tbody.appendChild(el('tr',{class:'empty-row'},[el('td',{colspan:5},[(q||state.vehicleAssignedFilter)?'No vehicles match this filter.':'No vehicles yet — add the first one.'])]));
  }
  rows.forEach(v=>{
    tbody.appendChild(el('tr',{onclick:()=>openVehicleDrawer('view', v.id)},[
      el('td',{},[el('b',{},[v.reg_no])]),
      el('td',{},[v.model||'—']),
      el('td',{},[statusPill(v.status)]),
      el('td',{},[v.driver_name?el('span',{},[v.driver_name, ' ', statusPill(v.driver_status)]):el('span',{style:'color:var(--ink-soft)'},['Unassigned'])]),
      el('td',{},[String(v.document_count||0)]),
    ]));
  });
  table.appendChild(tbody);
  wrap.appendChild(el('div',{class:'card'},[table]));
  return wrap;
}

      } else {

        toast('Driver added.');
        await loadDrivers();
        state.drawer = {type:'driver', mode:'view', id:created.id, tab:'profile'};
        await loadDriverDetail(created.id);

function driverPersonalForm(detail){
  const f = {};
  const form = el('form',{});
  function section(title){ return el('div',{style:'font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;margin:22px 0 10px;'},[title]); }
  function field(labelText, key, opts){
    opts = opts||{};
    const val = detail[key];
    const input = opts.select
      ? (()=>{
          const sel = el('select',{});
          opts.select.forEach(([v,l])=> sel.appendChild(el('option',{value:v, selected: val===v?'selected':null},[l])));
          return sel;
        })()
      : el(opts.textarea?'textarea':'input', Object.assign({type:opts.type||'text', value: val!=null?val:''}, opts.attrs||{}));
    f[key]=input;
    return el('div',{class:'field'+(opts.full?' full':'')},[el('label',{},[labelText]), input]);
  }

  form.appendChild(section('Identity numbers'));
  let grid = el('div',{class:'form-grid'});
  grid.appendChild(field('Driving licence no.','license_no'));
  grid.appendChild(field('PAN card no.','pan_no'));
  grid.appendChild(field('Aadhar card no.','aadhar_no'));
  form.appendChild(grid);

  form.appendChild(section('Personal details'));
  grid = el('div',{class:'form-grid'});
  grid.appendChild(field('Blood group','blood_group',{select:[['','—'],['A+','A+'],['A-','A-'],['B+','B+'],['B-','B-'],['AB+','AB+'],['AB-','AB-'],['O+','O+'],['O-','O-']]}));
  grid.appendChild(field('Marital status','marital_status',{select:[['','—'],['Single','Single'],['Married','Married'],['Other','Other']]}));
  grid.appendChild(field('Experience','experience',{full:true, attrs:{placeholder:'e.g. 5 years, 2 with a commercial permit'}}));
  form.appendChild(grid);

  const stateOptions = [['','—'], ...INDIAN_STATES.map(s=>[s,s])];

  form.appendChild(section('Current address'));
  grid = el('div',{class:'form-grid'});
  grid.appendChild(field('Address line 1','current_address_line1',{full:true}));
  grid.appendChild(field('Address line 2','current_address_line2',{full:true}));
  grid.appendChild(field('City','current_address_city'));
  grid.appendChild(field('State','current_address_state',{select:stateOptions}));
  grid.appendChild(field('Pin code','current_address_pincode',{attrs:{maxlength:6, inputmode:'numeric', pattern:'[0-9]{6}'}}));
  form.appendChild(grid);

  form.appendChild(section('Permanent address'));
  const sameCheckWrap = el('label',{style:'display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:14px;cursor:pointer;'});
  const sameCheck = el('input',{type:'checkbox'});
  sameCheck.checked = !!detail.permanent_same_as_current;
  sameCheckWrap.appendChild(sameCheck);
  sameCheckWrap.appendChild(document.createTextNode('Same as current address'));
  form.appendChild(sameCheckWrap);

  grid = el('div',{class:'form-grid'});
  grid.appendChild(field('Address line 1','permanent_address_line1',{full:true}));
  grid.appendChild(field('Address line 2','permanent_address_line2',{full:true}));
  grid.appendChild(field('City','permanent_address_city'));
  grid.appendChild(field('State','permanent_address_state',{select:stateOptions}));
  grid.appendChild(field('Pin code','permanent_address_pincode',{attrs:{maxlength:6, inputmode:'numeric', pattern:'[0-9]{6}'}}));
  form.appendChild(grid);

  const permFields = ['permanent_address_line1','permanent_address_line2','permanent_address_city','permanent_address_state','permanent_address_pincode'];
  const curFields = ['current_address_line1','current_address_line2','current_address_city','current_address_state','current_address_pincode'];
  function syncPermanentFromCurrent(){
    permFields.forEach((pf,i)=>{ f[pf].value = f[curFields[i]].value; });
  }
  function applySameAsCurrent(){
    const same = sameCheck.checked;
    permFields.forEach(pf=>{ f[pf].disabled = same; });
    if(same) syncPermanentFromCurrent();
  }
  sameCheck.addEventListener('change', ()=>{
    applySameAsCurrent();
    if(!sameCheck.checked){
      permFields.forEach(pf=>{ f[pf].value = ''; });
    }
  });
  curFields.forEach(cf=> f[cf].addEventListener('input', ()=>{ if(sameCheck.checked) syncPermanentFromCurrent(); }));
  applySameAsCurrent();

  form.appendChild(section('Emergency contact'));
  grid = el('div',{class:'form-grid'});
  grid.appendChild(field('Contact name','emergency_contact_name'));
  grid.appendChild(field('Contact phone','emergency_contact_phone'));
  grid.appendChild(field('Relation','emergency_contact_relation',{attrs:{placeholder:'e.g. Father, Spouse'}}));
  form.appendChild(grid);

  form.appendChild(section('Bank account (for payouts)'));
  grid = el('div',{class:'form-grid'});
  grid.appendChild(field('Account no.','bank_account_no'));
  grid.appendChild(field('Bank name','bank_name'));
  grid.appendChild(field('Branch','bank_branch'));
  grid.appendChild(field('IFSC code','bank_ifsc'));
  form.appendChild(grid);

  const err = el('div',{class:'error-text'},['']);
  form.appendChild(err);
  form.appendChild(el('div',{style:'margin-top:16px;'},[
    el('button',{type:'submit', class:'btn primary'},['Save changes']),
  ]));
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(sameCheck.checked) syncPermanentFromCurrent();
    const payload = {name: detail.name, permanent_same_as_current: sameCheck.checked};
    Object.keys(f).forEach(k=> payload[k]=f[k].value);
    try{
      await api('/drivers/'+detail.id, {method:'PUT', body:payload});
      toast('Personal & bank details updated.');
      await loadDriverDetail(detail.id);
      if(state.drawer) state.drawer.editing = false;
      render();
    }catch(ex){ err.textContent = ex.message; }
  });
  return form;
}

  updateEmiVisibility();
  form.appendChild(grid);
  const notesArea = el('textarea',{},[vals.notes||'']);
  f.notes = notesArea;
  form.appendChild(el('div',{class:'field', style:'margin-top:12px;'},[el('label',{},['Notes']), notesArea]));
  const err = el('div',{class:'error-text'},['']);
  form.appendChild(err);
  form.appendChild(el('div',{style:'margin-top:16px;'},[
    el('button',{type:'submit', class:'btn primary'},[detail?'Save changes':'Add vehicle']),
  ]));
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const payload = {
      reg_no:f.reg_no.value, model:f.model.value, vehicle_type:f.vehicle_type.value,
      assigned_driver_id: f.assigned_driver_id.value || null, notes:f.notes.value,
      status: f.status ? f.status.value : undefined,
      is_jiju: f.is_jiju.checked, emi_period: f.emi_period.value,
      emi_amount: f.is_jiju.checked ? null : (f.emi_amount.value === '' ? null : f.emi_amount.value),
    };
    try{
      if(detail){
        await api('/vehicles/'+detail.id, {method:'PUT', body:payload});
        toast('Vehicle details updated.');
        await Promise.all([loadVehicles(), loadVehicleDetail(detail.id)]);
        if(state.drawer) state.drawer.editing = false;
      } else {
        const created = await api('/vehicles', {method:'POST', body:payload});
        toast('Vehicle added.');
        await loadVehicles();
        state.drawer = {type:'vehicle', mode:'view', id:created.id, tab:'profile'};
        await loadVehicleDetail(created.id);
      }
      render();
    }catch(ex){ err.textContent = ex.message; }
  });
  return form;
}

// ---------------- documents ----------------
function documentSection(kind, detail){
  const wrap = el('div',{});
  const labels = kind==='driver'?DRIVER_DOC_LABELS:VEHICLE_DOC_LABELS;
  const docs = detail.documents||[];

  const list = el('div',{class:'card', style:'margin-bottom:18px;'});
  if(!docs.length){
    list.appendChild(el('div',{style:'padding:22px;text-align:center;color:var(--ink-soft);font-size:13px;'},['No documents uploaded yet.']));
  } else {
    const inner = el('div',{style:'padding:4px 16px;'});
    docs.forEach(doc=>{
      inner.appendChild(el('div',{class:'doc-row'},[
        el('div',{class:'icon'},['📄']),
        el('div',{class:'meta'},[
          el('b',{},[labels[doc.doc_type]||doc.doc_type, doc.label?(' — '+doc.label):'']),
          el('span',{},[doc.file_name+' · uploaded '+fmtDate(doc.uploaded_at)+(doc.expires_on?(' · expires '+fmtDate(doc.expires_on)):'')]),
        ]),
        docExpiryPill(doc.expires_on),
        el('div',{class:'row-actions'},[
          el('a',{class:'icon-btn', title:'Download', href:'/api/'+(kind==='driver'?'driver-documents':'vehicle-documents')+'/'+doc.id+'/file', download:doc.file_name},['⬇ Download']),
          el('button',{class:'icon-btn danger', onclick:()=>deleteDocument(kind, detail, doc)},['Delete']),
        ]),
      ]));
    });
    list.appendChild(inner);
  }
  wrap.appendChild(list);

  const box = el('div',{class:'upload-box'});
  box.appendChild(el('div',{style:'font-weight:700;font-size:13px;margin-bottom:10px;'},['Upload a document']));
  const typeSelect = el('select',{});
  Object.entries(labels).forEach(([val,label])=> typeSelect.appendChild(el('option',{value:val},[label])));
  const fileInput = el('input',{type:'file'});
  const expiresInput = el('input',{type:'date'});
  const grid = el('div',{class:'form-grid'},[
    el('div',{class:'field'},[el('label',{},['Document type']), typeSelect]),
    el('div',{class:'field'},[el('label',{},['Expires on']), expiresInput]),
    el('div',{class:'field full'},[el('label',{},['File']), fileInput]),
  ]);
  box.appendChild(grid);
  const err = el('div',{class:'error-text'},['']);
  const uploadBtn = el('button',{class:'btn primary', type:'button'},['Upload']);
  uploadBtn.addEventListener('click', async ()=>{
    if(!fileInput.files[0]){ err.textContent='Choose a file first.'; return; }
    const fd = new FormData();
    fd.append('doc_type', typeSelect.value);
    if(expiresInput.value) fd.append('expires_on', expiresInput.value);
    fd.append('file', fileInput.files[0]);
    uploadBtn.disabled = true;
    try{
      await api('/'+(kind==='driver'?'drivers':'vehicles')+'/'+detail.id+'/documents', {method:'POST', body:fd});
      toast('Document uploaded.');
      if(kind==='driver'){ await loadDriverDetail(detail.id); await loadDrivers(); }
      else { await loadVehicleDetail(detail.id); await loadVehicles(); }
      render();
    }catch(ex){ err.textContent = ex.message; }
    finally{ uploadBtn.disabled = false; }
  });
  box.appendChild(err);
  box.appendChild(el('div',{style:'margin-top:10px;'},[uploadBtn]));
  wrap.appendChild(box);
  return wrap;
}
async function deleteDocument(kind, detail, doc){
  if(!confirm('Delete this document? This cannot be undone.')) return;
  try{
    await api('/'+(kind==='driver'?'driver-documents':'vehicle-documents')+'/'+doc.id, {method:'DELETE'});
    toast('Document deleted.');
    if(kind==='driver'){ await loadDriverDetail(detail.id); await loadDrivers(); }
    else { await loadVehicleDetail(detail.id); await loadVehicles(); }
    render();
  }catch(ex){ toast(ex.message, true); }
}

function historySection(history){
  const wrap = el('div',{class:'card'});
  if(!history.length){
    wrap.appendChild(el('div',{style:'padding:22px;text-align:center;color:var(--ink-soft);font-size:13px;'},['No status changes recorded yet.']));
    return wrap;
  }
  const inner = el('div',{style:'padding:4px 16px;'});
  history.forEach(h=>{
    inner.appendChild(el('div',{class:'hist-row'},[
      el('span',{class:'when'},[fmtDateTime(h.created_at)]),
      el('div',{},[
        el('div',{},[el('b',{},[h.action[0].toUpperCase()+h.action.slice(1)]), ' — ', h.from_status||'—', ' → ', h.to_status]),
        el('div',{style:'color:var(--ink-soft);margin-top:2px;'},[h.reason]),
      ]),
    ]));
  });
  wrap.appendChild(inner);
  return wrap;
}

// ---------------- modals ----------------
function openStatusModal(detail, action){
  state.modal = {type:'status', detail, action};
  render();
}
function openDeleteModal(kind, detail){
  state.modal = {type:'delete', kind, detail};
  render();
}
function openSetPinModal(detail){
  state.modal = {type:'setPin', detail};
  render();
}
function openSendMessageModal(detail){
  state.modal = {type:'sendMessage', detail};
  render();
}
function closeModal(){ state.modal=null; render(); }

function renderModal(){
  const overlay = el('div',{class:'overlay center', onclick:(e)=>{ if(e.target===overlay) closeModal(); }});
  const m = state.modal;
  const box = el('div',{class:'modal'});
  if(m.type==='status'){
    const labels = {suspend:'Suspend driver', reinstate:'Reinstate driver', terminate:'Terminate driver'};
    box.appendChild(el('h3',{},[labels[m.action]]));
    box.appendChild(el('div',{class:'desc'},['This will be recorded in '+m.detail.name+"'s status history. A reason is required."]));
    const reasonInput = el('textarea',{placeholder:'Reason…', style:'width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--cream);color:var(--ink);min-height:80px;'});
    box.appendChild(reasonInput);
    const err = el('div',{class:'error-text'},['']);
    box.appendChild(err);
    const actionBtnClass = m.action==='terminate'?'danger':m.action==='reinstate'?'good':'warn';
    const actions = el('div',{class:'actions'},[
      el('button',{class:'btn ghost', onclick:closeModal},['Cancel']),
      el('button',{class:'btn '+actionBtnClass, onclick: async ()=>{
        if(!reasonInput.value.trim()){ err.textContent='Reason is required.'; return; }
        try{
          await api('/drivers/'+m.detail.id+'/status', {method:'POST', body:{action:m.action, reason:reasonInput.value.trim()}});
          const pastTense = {suspend:'suspended', reinstate:'reinstated', terminate:'terminated'};
          toast('Driver '+pastTense[m.action]+'.');
          await Promise.all([loadDrivers(), loadDriverDetail(m.detail.id)]);
          state.modal=null;
          render();
        }catch(ex){ err.textContent = ex.message; }
      }},[labels[m.action]]),
    ]);
    box.appendChild(actions);
  } else if(m.type==='delete'){
    const nameLabel = m.kind==='driver'?m.detail.name:m.detail.reg_no;
    box.appendChild(el('h3',{},['Delete '+(m.kind==='driver'?'driver':'vehicle')+'?']));
    box.appendChild(el('div',{class:'desc'},['This permanently removes '+nameLabel+' and all of their documents. This is for correcting mistakes — for an active driver leaving the fleet, use Terminate instead so the record is kept.']));
    box.appendChild(el('div',{class:'actions'},[
      el('button',{class:'btn ghost', onclick:closeModal},['Cancel']),
      el('button',{class:'btn danger', onclick: async ()=>{
        try{
          if(m.kind==='driver') await api('/drivers/'+m.detail.id, {method:'DELETE'});
          else await api('/vehicles/'+m.detail.id, {method:'DELETE'});
          toast((m.kind==='driver'?'Driver':'Vehicle')+' deleted.');
          await refreshAll();
          state.modal=null; state.drawer=null;
          render();
        }catch(ex){ toast(ex.message, true); closeModal(); }
      }},['Delete']),
    ]));
  } else if(m.type==='setPin'){
    box.appendChild(el('h3',{},[m.detail.has_pin?'Reset PIN':'Set PIN']));
    box.appendChild(el('div',{class:'desc'},[m.detail.name+' will use their phone number and this PIN to log into the driver app at /driver.']));
    const pinInput = el('input',{type:'text', inputmode:'numeric', maxlength:6, placeholder:'4-6 digit PIN', style:'width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--cream);color:var(--ink);'});
    box.appendChild(pinInput);
    const err = el('div',{class:'error-text'},['']);
    box.appendChild(err);
    box.appendChild(el('div',{class:'actions'},[
      el('button',{class:'btn ghost', onclick:closeModal},['Cancel']),
      el('button',{class:'btn primary', onclick: async ()=>{
        try{
          await api('/drivers/'+m.detail.id+'/pin', {method:'PUT', body:{pin:pinInput.value.trim()}});
          toast('PIN saved.');
          await loadDriverDetail(m.detail.id);
          state.modal=null;
          render();
        }catch(ex){ err.textContent = ex.message; }
      }},['Save PIN']),
    ]));
  } else if(m.type==='sendMessage'){
    box.appendChild(el('h3',{},['Send message to '+m.detail.name]));
    box.appendChild(el('div',{class:'desc'},['Shows as a banner at the top of their app until they acknowledge it.']));
    const msgInput = el('textarea',{placeholder:'e.g. Please service the vehicle this weekend.', style:'width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--cream);color:var(--ink);min-height:80px;'});
    box.appendChild(msgInput);
    const err = el('div',{class:'error-text'},['']);
    box.appendChild(err);
    box.appendChild(el('div',{class:'actions'},[
      el('button',{class:'btn ghost', onclick:closeModal},['Cancel']),
      el('button',{class:'btn primary', onclick: async ()=>{
        if(!msgInput.value.trim()){ err.textContent='Message cannot be empty.'; return; }
        try{
          await api('/drivers/'+m.detail.id+'/announcements', {method:'POST', body:{message:msgInput.value.trim()}});
          toast('Message sent.');
          state.modal=null;
          render();
        }catch(ex){ err.textContent = ex.message; }
      }},['Send']),
    ]));
  }
  overlay.appendChild(box);
  return overlay;
}

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  if(state.modal){ closeModal(); }
  else if(state.drawer){ closeDrawer(); }
  else if(state.railOpen){ state.railOpen=false; render(); }
});

setInterval(async ()=>{
  if(!state.loggedIn || state.view!=='live-map') return;
  try{ state.liveLocations = await api('/locations/live'); if(state.view==='live-map') render(); }catch(e){}
}, 15000);

// ---------------- boot ----------------
async function boot(){
  try{
    const me = await api('/me');
    state.adminUsername = me.username;
    state.adminRole = me.role;
    await refreshAll();
    state.loggedIn = true;
  }catch(e){
    state.loggedIn = false;
  }
  state.loading = false;
  render();
}
boot();
</script>
</body>
</html>
